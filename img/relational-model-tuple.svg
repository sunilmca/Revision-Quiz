<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Tuple in a relational database table</title>
  <desc id="desc">A STUDENT relation with the row for S001, Aisha, and Computing highlighted as a tuple.</desc>
  <rect width="720" height="360" fill="#f8fafc"/>
  <rect x="48" y="42" width="624" height="276" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="78" y="82" fill="#0f172a" font-family="Arial, sans-serif" font-size="22" font-weight="700">STUDENT relation</text>
  <text x="78" y="108" fill="#64748b" font-family="Arial, sans-serif" font-size="14">Each row is one tuple (record).</text>
  <rect x="78" y="132" width="422" height="38" rx="7" fill="#e2e8f0"/>
  <text x="98" y="157" fill="#334155" font-family="Arial, sans-serif" font-size="14" font-weight="700">StudentID</text>
  <text x="235" y="157" fill="#334155" font-family="Arial, sans-serif" font-size="14" font-weight="700">Name</text>
  <text x="365" y="157" fill="#334155" font-family="Arial, sans-serif" font-size="14" font-weight="700">Programme</text>
  <rect x="78" y="176" width="422" height="46" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="98" y="204" fill="#1e3a8a" font-family="Arial, sans-serif" font-size="15" font-weight="700">S001</text>
  <text x="235" y="204" fill="#1e3a8a" font-family="Arial, sans-serif" font-size="15">Aisha</text>
  <text x="365" y="204" fill="#1e3a8a" font-family="Arial, sans-serif" font-size="15">Computing</text>
  <rect x="78" y="228" width="422" height="38" rx="7" fill="#f8fafc"/>
  <text x="98" y="253" fill="#475569" font-family="Arial, sans-serif" font-size="15">S002</text>
  <text x="235" y="253" fill="#475569" font-family="Arial, sans-serif" font-size="15">Daniel</text>
  <text x="365" y="253" fill="#475569" font-family="Arial, sans-serif" font-size="15">Business</text>
  <path d="M520 198h50" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
  <path d="m563 190 12 8-12 8" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="582" y="168" width="68" height="60" rx="10" fill="#2563eb"/>
  <text x="616" y="193" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="15" font-weight="700">Tuple</text>
  <text x="616" y="213" text-anchor="middle" fill="#dbeafe" font-family="Arial, sans-serif" font-size="11">one row</text>
  <text x="78" y="296" fill="#64748b" font-family="Arial, sans-serif" font-size="13">A tuple groups the attribute values for one entity instance.</text>
</svg>
